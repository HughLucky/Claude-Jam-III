<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quack-Stack</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0012;
        overflow: hidden;
        font-family: 'Arial Black', Arial, sans-serif;
        width: 100vw;
        height: 100vh;
      }
      #canvas-container {
        position: fixed;
        inset: 0;
      }
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #ui-root .interactive {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
